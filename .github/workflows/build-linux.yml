name: Build Linux Binary

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies for Qt and XCB
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libglx-mesa0 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyinstaller PyQt5 keyring minecraft-launcher-lib requests

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name LowCoreLauncher \
            --add-data "assets:assets" \
            --collect-submodules keyring.backends \
            --hidden-import minecraft_launcher_lib \
            --collect-all PyQt5 \
            main.py

      - name: Include Install Script in Distribution
        run: |
          cp install.sh dist/LowCoreLauncher/
          chmod +x dist/LowCoreLauncher/install.sh

      - name: Upload Linux Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LowCoreLauncher-Linux
          path: dist/LowCoreLauncher/
